name: Migração única — planilha para o Supabase

# TEMPORÁRIO: apaga e recarrega contas, fornecedores, categorias e solicitantes no Supabase
# com os dados atuais da planilha (Apps Script). Usado uma única vez na troca; remover depois.
# O repositório é público: nada de dados nos registros — só contagens e o resultado da conferência.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Copiar a planilha para o Supabase e conferir
        env:
          PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
          PGPORT: ${{ secrets.SUPABASE_DB_PORT }}
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          node supabase/gerar_importacao.js "$RUNNER_TEMP/importacao.sql" "$RUNNER_TEMP/conferencia.txt"
          psql -v ON_ERROR_STOP=1 -q -o /dev/null -f "$RUNNER_TEMP/importacao.sql"
          rm -f "$RUNNER_TEMP/importacao.sql"

          for t in contas fornecedores categorias solicitantes; do
            echo "$t no banco: $(psql -At -c "select count(*) from public.$t")"
          done

          BANCO=$(psql -At -c "select md5(string_agg(id || '|' || valor || '|' || vencimento || '|' || coalesce(data_pagamento::text, ''), ',' order by id)) from public.contas")
          ESPERADO=$(cat "$RUNNER_TEMP/conferencia.txt")
          if [ "$BANCO" = "$ESPERADO" ]; then
            echo "CONFERE: as contas no banco são idênticas às da planilha"
          else
            echo "::error::DIFERENTE: as contas no banco não batem com a planilha"
            exit 1
          fi
